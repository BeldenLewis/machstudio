  function getActiveCocoaModal() {
    var targetSelector = FIELDS && FIELDS.name ? FIELDS.name : 'input[name="input_107e42a3c0bd1"]';

    var candidates = Array.prototype.slice.call(
      document.querySelectorAll('#cocoaModal, .modal, [id*="cocoa"], [class*="modal"], .modal-scroll-control')
    ).filter(function(m) {
      try {
        return !!m.querySelector(targetSelector);
      } catch(e) {
        return false;
      }
    });

    if (!candidates.length) {
      return document.getElementById('cocoaModal');
    }

    var withValue = candidates.find(function(m) {
      var input = m.querySelector(targetSelector);
      return input && String(input.value || '').trim();
    });

    if (withValue) return withValue;

    var visible = candidates.find(function(m) {
      return !!(m.offsetWidth || m.offsetHeight || m.getClientRects().length);
    });

    if (visible) return visible;

    return candidates[candidates.length - 1];
  }

  function getCheckboxLabelText(cb) {
    var label = cb.closest('label');
    if (label) return label.textContent.trim();

    var parent = cb.parentElement;
    if (parent) return parent.textContent.trim();

    return '';
  }

  function collectFormData() {
    var modal = getActiveCocoaModal();

    if (!modal) {
      log('활성 모달 없음');
      return null;
    }

    var q = function(sel) {
      if (!sel || sel.includes('TODO')) return null;
      try { return modal.querySelector(sel); }
      catch(e) { return null; }
    };

    var qAll = function(sel) {
      if (!sel || sel.includes('TODO')) return [];
      try { return modal.querySelectorAll(sel); }
      catch(e) { return []; }
    };

    var allCheckboxes = Array.prototype.slice.call(
      modal.querySelectorAll('input[type="checkbox"]')
    );

    var privacyCb =
      allCheckboxes.find(function(cb) {
        var text = getCheckboxLabelText(cb);
        return text.indexOf('개인정보') > -1 || text.toLowerCase().indexOf('privacy') > -1;
      }) ||
      allCheckboxes.find(function(cb) {
        return !cb.name || cb.name === '';
      });

    var p1 = q(FIELDS.phone1);
    var p2 = q(FIELDS.phone2);
    var p3 = q(FIELDS.phone3);

    var phone = [p1, p2, p3]
      .filter(Boolean)
      .map(function(el) {
        return String(el.value || '').replace(/[^0-9]/g, '');
      })
      .filter(Boolean)
      .join('');

    var industries = [];

    Array.prototype.forEach.call(qAll(FIELDS.industry), function(cb) {
      if (!cb.checked) return;

      if (cb.value === 'etc') {
        var etcInput = q(FIELDS.industry_etc);
        var etcValue = etcInput ? etcInput.value.trim() : '';

        if (etcValue) {
          industries.push((IS_EN_PAGE ? 'Other: ' : '기타: ') + etcValue);
        } else {
          industries.push(IS_EN_PAGE ? 'Other' : '기타');
        }

        return;
      }

      var label = cb.closest('label') || cb.parentElement;
      var text = cb.value || (label ? label.textContent.trim() : '');
      if (text) industries.push(text.trim());
    });

    var marketingEl = q(FIELDS.marketing);
    var marketingAgreed = false;
    if (marketingEl) {
      var marketingType = String(marketingEl.getAttribute('type') || '').toLowerCase();
      marketingAgreed = (marketingType === 'checkbox' || marketingType === 'radio') ? !!marketingEl.checked : false;
    }

    var data = {
      agree_privacy:     privacyCb ? privacyCb.checked : true,
      agree_marketing:   marketingAgreed,

      name:       (q(FIELDS.name)       || {}).value || '',
      phone:      phone,
      email:      (q(FIELDS.email)      || {}).value || '',
      company:    (q(FIELDS.company)    || {}).value || '',
      department: (q(FIELDS.department) || {}).value || '',
      job_title:  (q(FIELDS.job_title)  || {}).value || '',
      industry:   industries.join(', '),
      question:   (q(FIELDS.question)   || {}).value || ''
    };

    data.name       = String(data.name).trim();
    data.email      = String(data.email).trim();
    data.company    = String(data.company).trim();
    data.department = String(data.department).trim();
    data.job_title  = String(data.job_title).trim();
    data.question   = String(data.question).trim();

    log('수집 결과:', data);
    return data;
  }

  function isValidFormData(formData) {
    if (!formData) return false;
    if (!formData.name) return false;
    if (!formData.phone && !formData.email) return false;
    if (!formData.agree_privacy) return false;
    return true;
  }

  function makeSubmissionKey(formData) {
    return [
      String(formData.name || '').trim().toLowerCase(),
      String(formData.phone || '').replace(/[^0-9]/g, ''),
      String(formData.email || '').trim().toLowerCase(),
      String(formData.company || '').trim().toLowerCase()
    ].join('|');
  }

  function isDuplicateSubmission(formData) {
    try {
      var key = makeSubmissionKey(formData);
      var saved = JSON.parse(sessionStorage.getItem('stk_last_submit') || '{}');
      var now = Date.now();

      if (saved.key === key && now - saved.time < 60000) {
        return true;
      }

      sessionStorage.setItem('stk_last_submit', JSON.stringify({
        key: key,
        time: now
      }));

      return false;
    } catch(e) {
      return false;
    }
  }

  function buildPayload(formData) {
    var memo = formData.question ? ('사전 질문: ' + formData.question) : null;

    return {
      submitted_at:      nowKSTString(),
      agree_marketing:   !!formData.agree_marketing,

      name:       formData.name,
      phone:      formData.phone,
      email:      formData.email,
      company:    formData.company,
      department: formData.department,
      job_title:  formData.job_title,
      industry:   formData.industry,
      memo:       memo
    };
  }

  async function postPayload(payload) {
    return fetch(SUPABASE_URL + '/rest/v1/' + TABLE_NAME, {
      method:'POST',
      keepalive: true,
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
  }

  async function sendToSupabase(formData) {
    if (!isValidFormData(formData)) {
      log('유효 데이터 부족, 전송 건너뜀', formData);
      return;
    }

    var payload = buildPayload(formData);
    log('전송 payload:', payload);

    try {
      var res = await postPayload(payload);

      if (res.ok) {
        log('✅ Supabase 전송 성공');
        return;
      }

      var errorText = await res.text();

      if (res.status === 409 || errorText.indexOf('duplicate key') > -1 || errorText.indexOf('ux_webinar') > -1) {
        log('⚠️ 중복 신청으로 판단되어 추가 저장하지 않음', res.status, errorText);
        return;
      }

      log('❌ Supabase 전송 실패', res.status, errorText);
    } catch(err) {
      log('❌ Supabase 전송 오류:', err);
    }
  }

  function onSubmitDetected(source) {
    if (dataSent) return;

    var formData = collectFormData();

    if (!isValidFormData(formData)) {
      log('제출 감지됨 but 유효 데이터 부족:', source, formData);
      return;
    }

    if (isDuplicateSubmission(formData)) {
      log('중복 제출 감지, 전송 건너뜀:', source, formData);
      return;
    }

    dataSent = true;
    log('제출 감지:', source);

    sendToSupabase(formData).finally(function() {
      setTimeout(function() {
        dataSent = false;
      }, 10000);
    });
  }

  function isFormRequest(url) {
    return typeof url === 'string' && url.includes('/ajax/form_add.cm');
  }

  var origOpen = XMLHttpRequest.prototype.open;
  var origSend = XMLHttpRequest.prototype.send;

  XMLHttpRequest.prototype.open = function(method, url) {
    this._stk_method = method;
    this._stk_url = url;
    return origOpen.apply(this, arguments);
  };

  XMLHttpRequest.prototype.send = function() {
    if (String(this._stk_method).toUpperCase() === 'POST' && isFormRequest(this._stk_url)) {
      onSubmitDetected('XHR: ' + this._stk_url);
    }

    return origSend.apply(this, arguments);
  };

  var origFetch = window.fetch;

  window.fetch = function(url, options) {
    var requestUrl = typeof url === 'string' ? url : (url && url.url ? url.url : '');

    if (options && String(options.method).toUpperCase() === 'POST' && isFormRequest(requestUrl)) {
      onSubmitDetected('fetch: ' + requestUrl);
    }

    return origFetch.apply(this, arguments);
  };

  function hookSubmitButtons() {
    var modal = getActiveCocoaModal();
    if (!modal) return;

    modal.querySelectorAll('form').forEach(function(form) {
      if (form._stkSubmitHooked) return;
      form._stkSubmitHooked = true;

      form.addEventListener('submit', function() {
        onSubmitDetected('form submit fallback');
      }, true);
    });
  }

  new MutationObserver(function() {
    setTimeout(hookSubmitButtons, 200);
    setTimeout(hookSubmitButtons, 600);
    setTimeout(hookSubmitButtons, 1200);
  }).observe(document.body, {
    attributes: true,
    childList: true,
    subtree: true,
    attributeFilter: ['class','style']
  });

  window.STK_WEBINAR_DEBUG = {
    collectFormData: collectFormData,
    sendToSupabase: sendToSupabase,
    hookSubmitButtons: hookSubmitButtons,
    openRegistrationModal: openRegistrationModal,
    getActiveCocoaModal: getActiveCocoaModal,
    config: {
      path: path,
      host: HOST,
      isEnglish: IS_EN_PAGE,
      modalIds: MODAL_IDS,
      livePage: LIVE_PAGE_URL,
      supabase: SUPABASE_URL
    }
  };

  log('STK 웨비나 하단 배너 코드 로드 완료', {
    path: path,
    host: HOST,
    isEnglish: IS_EN_PAGE,
    modalIds: MODAL_IDS
  });

})();
</script>
